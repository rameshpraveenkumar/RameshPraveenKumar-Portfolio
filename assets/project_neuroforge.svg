<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#0b111a"/>
    </linearGradient>
    <linearGradient id="nfLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ce600"/>
      <stop offset="100%" stop-color="#6ec200"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#nfBg)"/>

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="30" width="520" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="30" width="520" height="42" rx="16" fill="#172033"/>
  <circle cx="65" cy="51" r="5" fill="#ef4444"/>
  <circle cx="82" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="51" r="5" fill="#10b981"/>
  <text x="125" y="55" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">neuroforge-enterprise-sdlc // pipeline-active</text>
  <rect x="460" y="42" width="80" height="18" rx="9" fill="#8ce600" fill-opacity="0.2"/>
  <text x="475" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8ce600">ONLINE</text>

  <!-- Left Sidebar / Metrics -->
  <rect x="60" y="90" width="130" height="220" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="75" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b">SERVICES</text>
  <rect x="75" y="130" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="85" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f8fafc">Spring Boot</text>
  <circle cx="162" cy="142" r="3.5" fill="#8ce600"/>

  <rect x="75" y="162" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="85" y="178" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f8fafc">Docker Engine</text>
  <circle cx="162" cy="174" r="3.5" fill="#8ce600"/>

  <rect x="75" y="194" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="85" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f8fafc">MySQL Cluster</text>
  <circle cx="162" cy="206" r="3.5" fill="#8ce600"/>

  <rect x="75" y="226" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="85" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f8fafc">JWT Security</text>
  <circle cx="162" cy="238" r="3.5" fill="#8ce600"/>

  <!-- Main Pipeline Flow Chart -->
  <g transform="translate(210, 90)">
    <rect width="330" height="110" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b">SDLC AUTOMATION PIPELINE</text>
    
    <!-- Stages -->
    <rect x="18" y="45" width="60" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">CODE</text>
    <text x="33" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8ce600">Passed</text>

    <line x1="82" y1="66" x2="98" y2="66" stroke="#8ce600" stroke-width="2"/>

    <rect x="100" y="45" width="60" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="113" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">BUILD</text>
    <text x="115" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8ce600">Passed</text>

    <line x1="162" y1="66" x2="178" y2="66" stroke="#8ce600" stroke-width="2"/>

    <rect x="180" y="45" width="60" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="194" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">TEST</text>
    <text x="195" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8ce600">100%</text>

    <line x1="242" y1="66" x2="258" y2="66" stroke="#8ce600" stroke-width="2"/>

    <rect x="260" y="45" width="55" height="42" rx="6" fill="#8ce600" fill-opacity="0.15" stroke="#8ce600"/>
    <text x="269" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8ce600">DEPLOY</text>
    <text x="274" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#ffffff">Active</text>
  </g>

  <!-- Bottom Metric Graphs -->
  <g transform="translate(210, 215)">
    <rect width="330" height="95" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b">TELEMETRY &amp; LATENCY</text>
    
    <!-- Mini sparkline -->
    <path d="M 20 70 L 60 55 L 100 62 L 140 40 L 180 50 L 220 30 L 260 45 L 305 25" fill="none" stroke="url(#nfLime)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="305" cy="25" r="4.5" fill="#8ce600"/>
  </g>
</svg>
