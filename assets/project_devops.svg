<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ce600"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#cloudBg)"/>

  <!-- Window Container -->
  <rect x="40" y="30" width="520" height="300" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="40" y="30" width="520" height="42" rx="16" fill="#1e293b"/>
  <circle cx="65" cy="51" r="5" fill="#ef4444"/>
  <circle cx="82" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="51" r="5" fill="#10b981"/>
  <text x="125" y="55" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">docker-compose.yml // cluster-orchestration</text>
  <rect x="450" y="42" width="90" height="18" rx="9" fill="#8ce600" fill-opacity="0.2"/>
  <text x="460" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8ce600">STABLE</text>

  <!-- Code Snippet on Left -->
  <g transform="translate(60, 90)">
    <rect width="230" height="220" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="16" y="28" font-family="monospace" font-size="11" fill="#38bdf8">services:</text>
    <text x="28" y="48" font-family="monospace" font-size="11" fill="#8ce600">  neuroforge-core:</text>
    <text x="40" y="68" font-family="monospace" font-size="11" fill="#94a3b8">    build: ./api</text>
    <text x="40" y="88" font-family="monospace" font-size="11" fill="#94a3b8">    ports: ["8080:8080"]</text>
    <text x="40" y="108" font-family="monospace" font-size="11" fill="#e2e8f0">    security: jwt-auth</text>
    <text x="28" y="132" font-family="monospace" font-size="11" fill="#8ce600">  mysql-cluster:</text>
    <text x="40" y="152" font-family="monospace" font-size="11" fill="#94a3b8">    image: mysql:8.0</text>
    <text x="40" y="172" font-family="monospace" font-size="11" fill="#94a3b8">    status: healthy</text>
    <text x="28" y="196" font-family="monospace" font-size="11" fill="#f59e0b">  redis-cache: ...</text>
  </g>

  <!-- Cloud Node Architecture on Right -->
  <g transform="translate(310, 90)">
    <rect width="230" height="220" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b">CONTAINER TOPOLOGY</text>

    <!-- Node 1: Client Gateway -->
    <rect x="25" y="45" width="180" height="38" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">React Client Gateway</text>

    <!-- Arrow down -->
    <line x1="115" y1="83" x2="115" y2="103" stroke="#8ce600" stroke-width="2"/>
    <polygon points="115,108 111,100 119,100" fill="#8ce600"/>

    <!-- Node 2: Spring Boot API -->
    <rect x="25" y="108" width="180" height="38" rx="8" fill="#1e293b" stroke="#8ce600"/>
    <text x="42" y="131" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8ce600">Spring Boot + JWT Auth</text>

    <!-- Arrow down -->
    <line x1="115" y1="146" x2="115" y2="166" stroke="#8ce600" stroke-width="2"/>
    <polygon points="115,171 111,163 119,163" fill="#8ce600"/>

    <!-- Node 3: MySQL DB -->
    <rect x="25" y="171" width="180" height="38" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="48" y="194" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">MySQL Database &amp; Cache</text>
  </g>
</svg>
